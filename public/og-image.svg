<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#121316">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212329"/>
      <stop offset="100%" stop-color="#17181D"/>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="630" fill="#121316"/>

  <!-- Outer Editorial Double Borders -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#B58E62" stroke-width="1.5" stroke-opacity="0.45"/>
  <rect x="46" y="46" width="1108" height="538" fill="none" stroke="#B58E62" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Rear Asymmetrical Depth Slab -->
  <rect x="250" y="105" width="720" height="420" rx="30" fill="#16171B" stroke="rgba(255,255,255,0.03)" stroke-width="1" transform="rotate(1.2 610 315)"/>

  <!-- Primary Foreground Card -->
  <rect x="220" y="95" width="760" height="440" rx="28" fill="url(#cardBg)" stroke="#B58E62" stroke-width="1" stroke-opacity="0.35" filter="url(#cardShadow)"/>

  <!-- Top Eyebrow Badge -->
  <rect x="470" y="155" width="260" height="34" rx="17" fill="#B58E62" fill-opacity="0.12" stroke="#B58E62" stroke-width="1" stroke-opacity="0.5"/>
  <text x="600" y="177" text-anchor="middle" fill="#D8B28A" font-family="system-ui, -apple-system, sans-serif" font-size="12px" font-weight="600" letter-spacing="0.25em">
    &#8226; SOFTWARE ENGINEER &#8226;
  </text>

  <!-- Name Heading (Serif Anchor) -->
  <text x="600" y="285" text-anchor="middle" fill="#F4F4F6" font-family="'Playfair Display', 'Newsreader', 'Cormorant Garamond', 'Georgia', serif" font-size="64px" font-weight="600" letter-spacing="-0.01em">
    Ritwik Gupta
  </text>

  <!-- Brass Divider with Center Diamond -->
  <line x1="420" y1="345" x2="570" y2="345" stroke="#B58E62" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="600,339 606,345 600,351 594,345" fill="#B58E62"/>
  <line x1="630" y1="345" x2="780" y2="345" stroke="#B58E62" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Subtitle Specialization -->
  <text x="600" y="415" text-anchor="middle" fill="#C8A27A" font-family="system-ui, -apple-system, sans-serif" font-size="14px" font-weight="600" letter-spacing="0.3em">
    SYSTEMS &amp; DISTRIBUTED INFRASTRUCTURE
  </text>
</svg>
